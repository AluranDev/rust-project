[workspace]
members = [
    "crates/audio",
    "crates/rtc",
    "apps/client",
    "apps/signaling-server",
]
resolver = "3"

[workspace.dependencies]
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
cpal = "0.18.2"
webrtc = "0.21.1"
axum = { version = "0.8.9", features = ["ws"] }
ringbuf = { version = "0.6.0" }

webrtc-core = {
    package = "rtc",
    version = "0.21.1",
    default-features = false
}
bytes = "1.12.1"

async-trait = "0.1.92"
# Shared protocol and local signaling transport
futures-util = "0.3"
tokio-tungstenite = "0.29"
