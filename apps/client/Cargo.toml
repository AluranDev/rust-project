[package]
name = "voice-client"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { workspace = true }
cpal = { workspace = true }
webrtc = { workspace = true }
serde = { workspace = true }

audio = { path = "../../crates/audio" }
rtc = { path = "../../crates/rtc" }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
signaling-server = { path = "../signaling-server" }
axum = { workspace = true }
